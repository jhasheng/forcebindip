name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-${{ matrix.arch }} -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Smoke test
        run: .\build-${{ matrix.arch }}\Release\forcebindip_cpp.exe --version
